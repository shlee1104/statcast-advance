# statcast-advance configuration
#
# Thresholds live here rather than in code so they can be tuned without
# touching logic, and so the assumptions behind every flag are auditable
# in one place.

data:
  # Default season used when --season is not passed.
  # 2025 is complete, which makes league baselines stable.
  default_season: 2025

  # Where the local DuckDB cache lives (gitignored).
  db_path: "data/statcast.duckdb"

  # Skip spring training and exhibition games; keep regular season
  # and postseason only.
  game_types: ["R", "F", "D", "L", "W"]

  # Politeness settings for Baseball Savant. Do not lower these.
  request_timeout_seconds: 120
  seconds_between_requests: 3
  max_retries: 3

  # Treat a cached player-season as fresh for this many days before
  # re-fetching. In-season data changes; completed seasons do not.
  cache_ttl_days: 1

baselines:
  # League reference data is built by sampling dates rather than pulling a full
  # season. One date is roughly 4,400 pitches, so 30 dates gives ~130k — ample
  # for count-level and pitch-type-level rates, at a fraction of the requests.
  n_dates: 30

  # Sampling is stratified: the season is split into n_dates equal intervals and
  # one date is drawn from each. This guarantees coverage across the season
  # while the within-interval draw avoids aligning to a fixed day of the week,
  # which would bias toward whichever weekdays carry more games.
  seed: 17

  # Regular season window, as month-day. Sampling stays inside this.
  season_start: "03-20"
  season_end: "10-01"

  # Baselines are computed separately for each pitcher handedness. Comparing a
  # right-hander against a pool containing left-handers understates how unusual
  # his pitch mix is.
  split_by_handedness: true

report:
  output_dir: "reports"
  max_takeaways: 5

  # The balls-by-strikes grid greys out a count only when the COUNT is thin.
  # A share's precision is set by how many pitches were thrown in that count,
  # so a pitch he threw 5 times out of 225 in 0-2 is a well-measured 2% and
  # stays visible — that near-empty cell is often the finding.
  count_grid_min_count: 30

  # Findings arrive in different units — a share delta, a velocity drop in mph,
  # a lift ratio — and the top takeaways have to be ranked against each other.
  #
  # Where a league proportion exists, severity is standard errors from that
  # proportion, which is a real measurement: it demotes a large deviation on a
  # thin sample automatically. Roughly |z| > 2 is worth reporting, so severity
  # is on that scale.
  #
  # Fatigue and lift findings have no league proportion to test against, so
  # they are scaled onto the same axis by how far past their own threshold they
  # sit, multiplied by the weight below. THESE WEIGHTS ARE A JUDGMENT CALL, not
  # a measurement, and every finding records which basis produced its severity
  # so the two are never silently conflated.
  # Only predictable_count has a true league proportion behind it and is
  # therefore ranked by z-score; every other flag is scaled by the weight
  # below. Equal weights are the honest starting point — they say "these
  # matter about the same amount", which is a claim I can defend, where tuned
  # weights would imply a precision that does not exist yet.
  severity_weights:
    predictable_count: 2.0
    handedness_gap: 2.0
    hittable_pitch: 2.0
    fatigue: 2.0
    sequencing_tell: 2.0
    location_tell: 2.0
    first_pitch: 2.0

  # Pitch types seen fewer than this many times are folded into "Other"
  # so the report is not cluttered by misclassifications.
  min_pitches_to_display: 15

  # Arsenal membership is a rate question, not a count question: a pitch is a
  # real offering if he goes to it a meaningful share of the time. An absolute
  # threshold would behave completely differently against a starter's 3,000
  # pitches and a reliever's 900.
  min_arsenal_share: 0.01

  # Absolute floor, guarding only against tiny samples where a share of 1%
  # can be a single pitch.
  min_arsenal_pitches: 5

# Cutoffs that decide which sentence the hitting plan writes.
#
# Set from the calibration run over 25 pitchers, 50 pitcher-sides, 2025
# (scripts/batch_reports.py). The first values were set by judgment against
# Yamamoto and Skubal alone; the run showed several firing for nearly every
# pitcher, which means the line describes the league rather than the man.
# The aim for each is that it fires for a minority, and that the sentence it
# writes is one a hitter could act on.
plan:
  # Called-strike rate on TAKEN first pitches. At or above `swing_above`,
  # taking often puts the hitter down 0-1; at or below `take_below`, taking
  # is fine. Between the two, the plan says there is no strong case.
  #
  # Across the run this rate had a median of 0.45 and a middle half of
  # 0.39-0.49. The old pair (0.55 / 0.45) told 53% of sides to take and 4% to
  # swing. These sit near the quartiles, so roughly a quarter get each piece
  # of advice and the middle half get none. The split reads true: zone-pounders
  # (Webb, Hendricks) land on "swing", Snell, Senga and Mason Miller on "take".
  first_pitch_swing_above: 0.50
  first_pitch_take_below: 0.40

  # When the hitter is ahead in the count: "sit hard" when fastballs take at
  # least `sit_hard_share`; otherwise "sit <pitch>" when one pitch takes at
  # least `sit_pitch_share`; otherwise "he mixes".
  #
  # League right-handers throw a fastball 63% of the time in hitter's counts,
  # so the old 0.60 fired for an ordinary pitcher (60% of sides). 0.70 is
  # clearly above the league habit. "Sit <pitch>" needs a majority: the old 0.40
  # wrote "sit four-seam — 42%" (Snell) and "47%" (Cease), and nobody sits on a
  # pitch he will see less than half the time.
  sit_hard_share: 0.70
  sit_pitch_share: 0.50

  # Two strikes: name a put-away pitch only if it is at least this share of his
  # two-strike pitches; below it, say he mixes. The old rule always named one,
  # including "expect the four-seam (26%)" for Kirby against lefties.
  two_strike_min_share: 0.33

  # Two strikes: say "lay off it low" when at least this share of his two-strike
  # pitch finishes below the zone, and only quote a miss rate on this many swings.
  lay_off_low_share: 0.50
  min_two_strike_swings: 20

  # "Won't see": a pitch one side gets less than this share of the time.
  rare_share: 0.03

  # "Count tell": a pitch at more than this multiple of his own rate in a
  # specific count (3-0 excluded). 2.0 reads as "more than double".
  count_tell_lift: 2.0

  # ...and at least this share of the pitches in that count. Lift alone wrote
  # "the curveball jumps to about 5% — expect it there" (Imanaga).
  count_tell_min_share: 0.25

# Minimum sample sizes before a weakness flag is allowed to fire.
# These are the guardrails against small-sample noise. Every flag must
# clear its gate, and every claim in the report carries its own n.
flags:
  min_n:
    predictable_count: 20
    handedness_gap: 40
    hittable_pitch: 50
    fatigue_outings: 10
    sequencing_tell: 25
    location_leak: 40
    location_tell: 40
    first_pitch: 30

    # Third-trip findings are measured in pitches, not outings, because the
    # decomposition compares rates rather than counting starts.
    times_through_order: 150

  thresholds:
    # A count is a finding when it changes what HE does, measured against his
    # own overall rate for that pitch.
    #
    # This replaced a league comparison, and the reason is the single most
    # important judgment in this file. Against league, Yamamoto's splitter is
    # 5-7x in all five counts where he uses it, so the report said "he throws a
    # splitter" five times with the count changed — one true fact about who he
    # is, dressed up as five findings about what he will throw. Against his own
    # rate, the splitter compresses to 1.2-1.9x and the cutter appears at 2.4x
    # in 2-1 and 3-1, which he then abandons with two strikes. That is the
    # exploitable pattern and the league comparison hid it, because his cutter
    # usage overall is only 1.5x league so it never crossed any threshold.
    #
    # League rates are still reported as context — they answer "who is this
    # guy" — but they no longer decide what fires.
    predictable_count_own_lift: 1.50

    # Kept for the league context line in the claim, not as a gate.
    predictable_count_share: 0.75
    predictable_count_delta_vs_league: 0.15

    # Or, short of dominating, when the deviation from league is extreme
    # enough to be the finding on its own. Yamamoto throws the splitter 50% of
    # the time in 0-2 against a league rate of 7% — six times league, z = 24 —
    # and the 0.75 share gate above silently discarded it, while passing an
    # 82% four-seam in 3-0 that beats league by only 16 points. The absolute
    # share and the deviation from league are different questions, and the
    # second one is what makes a count exploitable.
    predictable_count_z: 4.0

    # Usage gap between vs-LHH and vs-RHH for an effective pitch
    handedness_usage_gap: 0.20

    # xwOBA above league average for that pitch type
    hittable_pitch_xwoba_delta: 0.060

    # Velocity decline, in mph, across an outing
    fatigue_velo_drop_mph: 1.0

    # A tell only counts as a weakness if the pattern costs him runs when it
    # holds. Yamamoto's splitter is the case that forced this: hitters know it
    # is coming with two strikes and still post a .191 xwOBA against it, so
    # flagging it as exploitable hands a coach a plan that does not work.
    #
    # Measured as (run value when the pattern holds − his norm for that pitch)
    # × occurrences, using Savant's delta_run_exp, where positive favours the
    # batter. One run over a season is deliberately a low bar: it filters
    # patterns with no consequence at all without pretending the estimate is
    # precise enough to rank fine differences.
    min_runs_cost: 1.0

    # Any transition probability at or above this is a tell
    sequencing_tell_prob: 0.65

    # Or, short of that, a follow-up made this many times more likely than the
    # pitcher's baseline rate for it. A 30% pitch at 2x baseline is a tell even
    # though 30% is not a majority.
    sequencing_tell_lift: 1.50

    # Third time through the order, an xwOBA rise of this much counts as
    # results decaying. Paired with whether velocity held, that is what
    # separates familiarity from fatigue.
    tto_xwoba_rise: 0.020

    # Share of a pitch type concentrated in a single zone quadrant.
    # Descriptive only — see location_tell_lift below for why this is not
    # wired to a flag. Most pitchers concentrate most offerings in one
    # quadrant, because that is what executing a plan looks like, so a
    # threshold on concentration alone fires on nearly everything.
    location_leak_share: 0.40

    # The location finding that is actually actionable runs the other
    # direction: given the region the ball is headed for, how much does that
    # narrow down which pitch it is. Lift is P(pitch | band) divided by the
    # pitcher's baseline rate for that pitch, so 1.35 means a band makes a
    # pitch 35% more likely than his overall mix would suggest.
    location_tell_lift: 1.35

    # Lift alone is not enough to act on. Knowing a band moves a pitch from a
    # 26% baseline to 37% is a real 1.42x, but no hitter commits to a pitch
    # he will see a third of the time. A band has to point to something close
    # to a plurality before the information is usable, so a share floor sits
    # alongside the lift bar and both must clear.
    #
    # JUDGMENT CALL: 0.45 is where "he is probably throwing X" starts being a
    # sentence worth putting in front of a hitter. It is not derived.
    location_tell_share: 0.45

    # Share of the pitcher's pitch-type uncertainty removed by knowing the
    # band, as normalized information gain in [0, 1]: 0.0 means location says
    # nothing about pitch type, 1.0 means it identifies the pitch outright.
    #
    # PROVISIONAL. Calibrated against two pitchers, which is not enough to set
    # a threshold with. Both landed near 0.10 while showing per-band lifts
    # above 1.6, so the lift above is what the flag fires on; this value only
    # decides whether the report prints a summary sentence about location
    # carrying information overall. Revisit once more pitchers have been run.
    location_tell_info: 0.08

    # First-pitch predictability
    first_pitch_share: 0.70
    first_pitch_strike_rate_low: 0.52
