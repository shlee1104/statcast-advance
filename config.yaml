# statcast-advance configuration
#
# Thresholds live here rather than in code so they can be tuned without
# touching logic, and so the assumptions behind every flag are auditable
# in one place.

data:
  # Default season used when --season is not passed. The 2026 regular season
  # is complete; postseason games are included as they are played.
  default_season: 2026

  # A single season below this many pitches gets a printed suggestion to add
  # the previous one with --seasons. Count and side tendencies split a season
  # roughly twenty ways, and below this most of those cells are thin.
  thin_sample_pitches: 1500

  # Where the local DuckDB cache lives (gitignored).
  db_path: "data/statcast.duckdb"

  # Skip spring training and exhibition games; keep regular season
  # and postseason only.
  game_types: ["R", "F", "D", "L", "W"]

  # Politeness settings for Baseball Savant. Do not lower these.
  request_timeout_seconds: 120
  seconds_between_requests: 3
  max_retries: 3

  # Treat a cached player-season as fresh for this many days before
  # re-fetching. In-season data changes; completed seasons do not.
  cache_ttl_days: 1

baselines:
  # League reference data is built by sampling dates rather than pulling a full
  # season. A date with games averages about 3,700 pitches, and one or two of
  # the 30 land on days without any, so the sample is roughly 100k (2025:
  # 102,280 pitches from 28 dates) — ample for count-level and pitch-type-level
  # rates, at a fraction of the requests.
  n_dates: 30

  # Sampling is stratified: the season is split into n_dates equal intervals and
  # one date is drawn from each. This guarantees coverage across the season
  # while the within-interval draw avoids aligning to a fixed day of the week,
  # which would bias toward whichever weekdays carry more games.
  seed: 17

  # Regular season window, as month-day. Sampling stays inside this.
  season_start: "03-20"
  season_end: "10-01"

  # Baselines are computed separately for each pitcher handedness. Comparing a
  # right-hander against a pool containing left-handers understates how unusual
  # his pitch mix is.
  split_by_handedness: true

report:
  output_dir: "reports"
  max_takeaways: 5

  # The balls-by-strikes grid greys out a count only when the COUNT is thin.
  # A share's precision is set by how many pitches were thrown in that count,
  # so a pitch he threw 5 times out of 225 in 0-2 is a well-measured 2% and
  # stays visible — that near-empty cell is often the finding.
  count_grid_min_count: 30

  # Below this many pitches the report marks nothing as standing out from his
  # usual: the sequence graph is drawn without colour, the count grid without
  # outlines, the card without its sequence line, and both pages say why.
  # The plan's lines and the numbers themselves are unchanged.
  #
  # The reason is the sample-size check (scripts/sample_size.py). A follow-up
  # coloured on three starts came back past its bar 12% of the time, on five
  # 35%, on ten 57%, against 67% on half a season; a count tendency at three
  # standard errors, 36%, 58%, 67% and 69%. Ten starts averaged 925 pitches.
  # The plan's lines held up at every size, so they are not touched.
  #
  # JUDGMENT CALL, and one made after reading that check, so the check is not
  # also a test of it.
  standouts_min_pitches: 900

  # For the findings engine (src/flags.py), which the report no longer prints
  # but the replication check still runs; `max_takeaways` above belongs to it
  # as well.
  #
  # Findings arrive in different units — a share, a lift ratio, a velocity drop
  # in mph — and have to be ranked against each other. Each is scored by how
  # far past its own threshold it sits and how large its sample is against its
  # gate, multiplied by the weight below. THESE WEIGHTS ARE A JUDGMENT CALL,
  # not a measurement. Equal weights say "these matter about the same amount",
  # which can be defended; tuned weights would imply a precision that does not
  # exist. That the ranking rests on them is one reason the ranked list came
  # off the page.
  severity_weights:
    predictable_count: 2.0
    handedness_gap: 2.0
    fatigue: 2.0
    sequencing_tell: 2.0
    location_tell: 2.0
    first_pitch: 2.0

  # Pitch types seen fewer than this many times are folded into "Other"
  # so the report is not cluttered by misclassifications.
  min_pitches_to_display: 15

  # Arsenal membership is a rate question, not a count question: a pitch is a
  # real offering if he goes to it a meaningful share of the time. An absolute
  # threshold would behave completely differently against a starter's 3,000
  # pitches and a reliever's 900.
  min_arsenal_share: 0.01

  # Absolute floor, guarding only against tiny samples where a share of 1%
  # can be a single pitch.
  min_arsenal_pitches: 5

# When seasons are combined (--seasons), the latest is compared against the
# earlier ones to say what changed. Shares are of all his pitches that season.
seasons:
  # A pitch is "new" when it was under `absent_below` before and at least
  # `present_at` now, and "dropped" the other way round. Dropped pitches are
  # left out of the report.
  absent_below: 0.01
  present_at: 0.03

  # Usage moved by at least this much, and by more than noise.
  usage_shift: 0.08
  usage_shift_z: 2.5

  # Average speed moved by at least this much, on pitches thrown at least
  # `min_pitches` times in both.
  velo_change_mph: 1.0
  min_pitches: 50

# Cutoffs that decide which sentence the hitting plan writes.
#
# Set from the calibration run over 25 pitchers, 50 pitcher-sides, 2025
# (scripts/batch_reports.py) — the 25 of the 30 on the list that ran at the
# time. Rerun on all 30 (60 pitcher-sides) on 2026-10-12 with the same
# cutoffs: the spreads quoted below did not move. The first values were set
# by judgment against Yamamoto and Skubal alone; the run showed several firing for nearly every
# pitcher, which means the line describes the league rather than the man.
# The aim for each is that it fires for a minority, and that the sentence it
# writes is one a hitter could act on.
plan:
  # No cutoff for the first-pitch line: it states his mix and nothing else.
  # It used to add "take" or "swing" from the called-strike rate on TAKEN
  # first pitches (cutoffs 0.50 / 0.40, on at least 80 takes). On 2026, a
  # season those cutoffs had never seen, the advice held 7 times in 12 and his
  # own rate predicted his second half no better than the average pitcher's
  # (skill +0.01, 95% interval -0.53 to +0.35), so the advice and its three
  # cutoffs were removed. The run is reproducible at commit cc5a2ed.

  # When the hitter is ahead in the count: "sit hard" when fastballs take at
  # least `sit_hard_share`; otherwise "sit <pitch>" when one pitch takes at
  # least `sit_pitch_share`; otherwise "he mixes".
  #
  # League right-handers throw a fastball 63% of the time in hitter's counts,
  # so the old 0.60 fired for an ordinary pitcher (60% of sides). 0.70 is
  # clearly above the league habit. "Sit <pitch>" needs a majority: the old 0.40
  # wrote "sit four-seam — 42%" (Snell) and "47%" (Cease), and nobody sits on a
  # pitch he will see less than half the time.
  sit_hard_share: 0.70
  sit_pitch_share: 0.50

  # "Sit <pitch>" also needs this lead over his next pitch. In the holdout
  # check it flipped 28% of the time without one, always on two-pitch
  # relievers near 50/50; "sit hard" never flipped.
  sit_pitch_min_lead: 0.15

  # Two strikes: name a put-away pitch only if it is at least this share of his
  # two-strike pitches; below it, say he mixes. The old rule always named one,
  # including "expect the four-seam (26%)" for Kirby against lefties.
  two_strike_min_share: 0.33

  # ...and at least this far ahead of the next pitch. Snell to lefties was
  # four-seam 35%, curveball 31%, slider 28%: a three-way tie, not a put-away
  # pitch.
  two_strike_min_lead: 0.10

  # With no clear put-away pitch, the plan says "look fastball and adjust" —
  # the standard two-strike approach, since a hitter on time for the fastball
  # can still react to a breaking ball but not the other way round. That is
  # only good advice if he still throws a fastball this share of the time with
  # two strikes; below it, the line names the off-speed pitches instead.
  two_strike_look_hard_min: 0.25

  # Two strikes: say "lay off it low" when at least this share of his two-strike
  # pitch finishes below the zone, and only quote a miss rate on this many swings.
  lay_off_low_share: 0.50
  min_two_strike_swings: 20

  # ...and only when that share is measured on at least this many located
  # pitches of that pitch. The line's own n counts every two-strike pitch to
  # the side, so without this the share could rest on a dozen pitches under an
  # n in the hundreds.
  lay_off_low_min_pitches: 20

  # "Won't see": a pitch one side gets less than this share of the time.
  rare_share: 0.03

  # "Count tell": a pitch at more than this multiple of his own rate in a
  # specific count (3-0 excluded). 2.0 reads as "more than double".
  count_tell_lift: 2.0

  # ...and at least this share of the pitches in that count. Lift alone wrote
  # "the curveball jumps to about 5% — expect it there" (Imanaga).
  count_tell_min_share: 0.25

# The one-page dugout card. Which plan lines go on it is decided in
# gameplan.card_keys(); these are the samples below which the card greys a
# number or leaves a picture out.
card:
  # A zone map is drawn for a pitch thrown at least this many times to that
  # batter side. Thirteen zones under fewer pitches is a picture of noise; the
  # card prints the pitch count in the map's place.
  zone_map_min_pitches: 40

  # A whiff rate resting on fewer than this many swings, or a chase rate on
  # fewer than this many pitches outside the zone, is printed in grey.
  min_rate_sample: 30

# Pitch tunneling (src/metrics/tunneling.py): how far apart a pitch and the
# one that followed it were when the hitter had to decide.
tunneling:
  # The decision point, in feet from the plate. Baseball Prospectus's
  # convention: where an average fastball is about 175 ms from contact. It is
  # a distance and a hitter's deadline is a time, so it is 172 ms out for a
  # 96 mph four-seam and 215 ms for a 77 mph curveball. Comparing both pitches
  # at one instant instead ranks pairs almost identically (Spearman 0.96 on
  # the fixtures), so the published convention is kept.
  tunnel_point_ft: 23.8

  # A pair of pitch types is averaged once it has occurred this many times to
  # one batter side. A single pair's separation is mostly where he happened
  # to throw those two pitches; its spread is 4 to 5 inches, so 30 pairs put
  # the mean within about an inch.
  min_pairs: 30

  # How a pair's offset at the decision point is put into words. The offset
  # is divided by his own pitch-to-pitch scatter there (d'): at 1.0, where the
  # ball is at that moment picks the right pitch of the two about 69% of the
  # time, and at 0 it is a coin flip.
  #
  #   at or under same_window_d   "same window": position alone gets it right
  #                               under 65% of the time
  #   at or over apart_d          "apart early": over 73%
  #   in between                  no word
  #
  # Both bars were set after looking at 2025 and 2026 together, so the hold
  # rates the replication script prints for them describe the fit. Of 74
  # "same window" pairs found in a first half, 91% stayed under 1.0 in the
  # second and 69% earned the word again; of 54 "apart early", 78% and 57%.
  same_window_d: 0.75
  apart_d: 1.25

  # The section's headline leads with a pair that shares a window only if the
  # two then move at least this many inches differently. Two pitches on one
  # path that also finish together deceive nobody.
  headline_late_in: 2.5

# Minimum sample sizes before a weakness flag is allowed to fire.
# These are the guardrails against small-sample noise. Every flag must
# clear its gate, and every claim in the report carries its own n.
flags:
  min_n:
    predictable_count: 20
    handedness_gap: 40
    fatigue_outings: 10
    sequencing_tell: 25
    location_leak: 40
    location_tell: 40
    first_pitch: 30

    # The sequence graph. A pitch needs this many follow-ups to one batter
    # side before anything is read off what came next...
    sequence_follow_ups: 40
    # ...a follow-up that is MORE likely than usual needs this many
    # occurrences, and one that is LESS likely needs this many expected at his
    # usual rate: a gap can only be a shortfall if there was something to fall
    # short of.
    sequence_transition: 20

  thresholds:
    # Every usage lift — a pitch in a count, in a location band, after a setup
    # pitch — must be at least this many standard errors from no lift at all
    # before it can be a finding, on top of its minimum sample.
    #
    # The minimum samples are not a noise filter on their own. "At least 20 of
    # that pitch at 1.5x his usual rate" admits 20 where 13.3 were expected,
    # which is 1.8 standard errors, and each report looks at 30-45 such cells
    # per family; several clear a bar that low by chance. Skubal's 2025 report
    # listed "in 0-1 he goes to the curveball 4% of the time against his own
    # 3%" (n=21, z = 2.4) as a finding. 3.0 is roughly what a Bonferroni
    # correction across 40 cells asks for (3.2). The test compares the cell
    # against everything outside it; see events.lift_z.
    frequency_min_z: 3.0

    # A count is a finding when it changes what HE does, measured against his
    # own overall rate for that pitch.
    #
    # This replaced a league comparison, and the reason is the single most
    # important judgment in this file. Against league, Yamamoto's splitter is
    # 5-7x in all five counts where he uses it, so the report said "he throws a
    # splitter" five times with the count changed — one true fact about who he
    # is, dressed up as five findings about what he will throw. Against his own
    # rate, the splitter compresses to 1.2-1.9x and the cutter appears at 2.4x
    # in 2-1 and 3-1, which he then abandons with two strikes. That is the
    # exploitable pattern and the league comparison hid it, because his cutter
    # usage overall is only 1.5x league so it never crossed any threshold.
    #
    # League rates are still reported as context — they answer "who is this
    # guy" — but they no longer decide what fires.
    predictable_count_own_lift: 1.50

    # Kept for the league context line in the claim, not as a gate.
    predictable_count_share: 0.75
    predictable_count_delta_vs_league: 0.15

    # Or, short of dominating, when the deviation from league is extreme
    # enough to be the finding on its own. Yamamoto throws the splitter 50% of
    # the time in 0-2 against a league rate of 7% — six times league, z = 24 —
    # and the 0.75 share gate above silently discarded it, while passing an
    # 82% four-seam in 3-0 that beats league by only 16 points. The absolute
    # share and the deviation from league are different questions, and the
    # second one is what makes a count exploitable.
    predictable_count_z: 4.0

    # Usage gap between vs-LHH and vs-RHH for an effective pitch
    handedness_usage_gap: 0.20

    # Velocity decline, in mph, across an outing. Measured on his most-used
    # fastball only and within each outing (see splits.fatigue), so it is not
    # moved by his pitch mix or by which outings lasted.
    fatigue_velo_drop_mph: 1.0

    # A tell only counts as a weakness if the pattern costs him runs when it
    # holds. Yamamoto's splitter is the case that forced this: hitters know it
    # is coming with two strikes and still post a .163 xwOBA against it there
    # (.203 on his other two-strike pitches; strikeouts count as zero), so
    # flagging it as exploitable hands a coach a plan that does not work.
    #
    # Measured as (run value when the pattern holds − his norm for that pitch)
    # × occurrences, using Savant's delta_run_exp, where positive favours the
    # batter. One run over a season is deliberately a low bar: it filters
    # patterns with no consequence at all without pretending the estimate is
    # precise enough to rank fine differences.
    min_runs_cost: 1.0

    # Any transition probability at or above this is a tell
    sequencing_tell_prob: 0.65

    # Or, short of that, a follow-up made this many times more likely than the
    # pitcher's baseline rate for it. A 30% pitch at 2x baseline is a tell even
    # though 30% is not a majority.
    sequencing_tell_lift: 1.50

    # The sequence graph colours a pitch-to-pitch follow-up that comes at
    # least `more` times as often as usual, or at most `less` times, and that
    # also clears frequency_min_z. The two are the same distance from 1.0 on a
    # ratio scale.
    #
    # Lower than the 1.50 above on purpose. That bar is for a setup keyed on
    # pitch AND height; pooled over every height, the same habit shows up
    # diluted. Checked first half against second across 58 pitcher-seasons, a
    # coloured follow-up kept its direction about 9 times in 10 and cleared
    # the bar again about 6 in 10, and that barely moved between 1.2 and 1.3.
    # The bar was chosen after looking at those runs, so the figures describe
    # the fit and are not a test of it (scripts/replication.py).
    sequence_more_lift: 1.25
    sequence_less_lift: 0.80

    # Share of a pitch type concentrated in a single zone quadrant.
    # Descriptive only — see location_tell_lift below for why this is not
    # wired to a flag. Most pitchers concentrate most offerings in one
    # quadrant, because that is what executing a plan looks like, so a
    # threshold on concentration alone fires on nearly everything.
    location_leak_share: 0.40

    # The location finding that is actually actionable runs the other
    # direction: given the region the ball is headed for, how much does that
    # narrow down which pitch it is. Lift is P(pitch | band) divided by the
    # pitcher's baseline rate for that pitch, so 1.35 means a band makes a
    # pitch 35% more likely than his overall mix would suggest.
    location_tell_lift: 1.35

    # Lift alone is not enough to act on. Knowing a band moves a pitch from a
    # 26% baseline to 37% is a real 1.42x, but no hitter commits to a pitch
    # he will see a third of the time. A band has to point to something close
    # to a plurality before the information is usable, so a share floor sits
    # alongside the lift bar and both must clear.
    #
    # JUDGMENT CALL: 0.45 is where "he is probably throwing X" starts being a
    # sentence worth putting in front of a hitter. It is not derived.
    location_tell_share: 0.45

    # Share of the pitcher's pitch-type uncertainty removed by knowing the
    # band, as normalized information gain in [0, 1]: 0.0 means location says
    # nothing about pitch type, 1.0 means it identifies the pitch outright.
    #
    # PROVISIONAL. Calibrated against two pitchers, which is not enough to set
    # a threshold with. Both landed near 0.10 while showing per-band lifts
    # above 1.6, so the lift above is what the flag fires on; this value only
    # decides whether the report prints a summary sentence about location
    # carrying information overall. Revisit once more pitchers have been run.
    location_tell_info: 0.08

    # First-pitch predictability: the share of first pitches that are his
    # most-used opener.
    first_pitch_share: 0.70

# The sample-size check (src/sample_size.py, scripts/sample_size.py): what the
# report says, and whether it is right, when it is built from a few starts.
sample_size:
  # Training samples, in starts. Three is a pitcher seen in March, five is the
  # start of conference play, ten is most of a college regular season. The
  # largest sample is always the whole training side: half a major-league
  # season, about 1,400 pitches, which is a weekend starter's full year.
  starts: [3, 5, 10]

  # Shuffles per pitcher-season. Each one holds out a different half of his
  # games, so the result does not hang on one lucky split.
  draws: 20
  seed: 17

  # A pitcher-season is used if it has this many regular-season games at this
  # many pitches a game (median): enough to hold half out and still draw ten
  # starts from the rest. Relievers are left out, because ten of their games
  # are 150 pitches and that is a different sample from ten starts.
  min_games: 20
  min_pitches_per_game: 60
